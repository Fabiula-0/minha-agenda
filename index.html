<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Fabiula - Protegida</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 350px; color: #333; }
        .status-nuvem { position: fixed; top: 10px; right: 10px; font-size: 10px; padding: 5px 10px; border-radius: 15px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 2000; font-weight: bold; }
        .tabs { display: flex; background: #fff; border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 900; }
        .tab { flex: 1; padding: 15px 5px; text-align: center; font-weight: bold; color: #666; cursor: pointer; border: none; background: none; }
        .tab.active { color: #2563eb; border-bottom: 3px solid #2563eb; background: #f8fafc; }
        .list { display: flex; flex-direction: column; gap: 12px; padding: 15px; }
        .item { background: white; padding: 16px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; border-left: 6px solid #2563eb; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item.done { opacity: 0.5; border-left-color: #94a3b8; }
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; border-top: 1px solid #ddd; z-index: 1000; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; margin-bottom: 8px; font-size: 16px; }
        .btn-main { background: #2563eb; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="status" class="status-nuvem">⏳ Conectando...</div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('agenda', this)">📅 Agenda</button>
        <button class="tab" onclick="switchTab('projetos', this)">🏗️ Projetos</button>
    </div>

    <div id="view-agenda">
        <div id="listaPrincipal" class="list"></div>
    </div>

    <div id="view-projetos" class="hidden">
        <div style="padding: 20px; text-align: center; color: #666;">Aba de Projetos em sincronia...</div>
    </div>

    <div class="footer">
        <input type="text" id="inpNome" placeholder="O que vai fazer?">
        <div style="display: flex; gap: 8px;">
            <input type="date" id="inpData" style="flex: 2;">
            <select id="selHora" style="flex: 1;"></select>
            <select id="selMin" style="flex: 1;"></select>
        </div>
        <button class="btn-main" onclick="adicionarTarefa()">AGENDAR AGORA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Sua configuração (mantida)
        const firebaseConfig = {
            apiKey: "AIzaSyDXrakHMCcdXzxSjzMbNB2LIy8i3R3rMLg",
            authDomain: "agendafabiula.firebaseapp.com",
            databaseURL: "https://agendafabiula-default-rtdb.firebaseio.com",
            projectId: "agendafabiula",
            storageBucket: "agendafabiula.firebasestorage.app",
            messagingSenderId: "234579715371",
            appId: "1:234579715371:web:5ec7ede77e169cd02f116e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const agendaRef = ref(db, 'fabiula_agenda');

        // Sincronização em tempo real
        onValue(agendaRef, (snapshot) => {
            const dados = snapshot.val();
            const lista = dados ? Object.entries(dados) : [];
            renderizar(lista);
            document.getElementById('status').innerText = "Sincronizado ✅";
        });

        window.adicionarTarefa = function() {
            const nome = document.getElementById('inpNome').value;
            const data = document.getElementById('inpData').value;
            const h = document.getElementById('selHora').value;
            const m = document.getElementById('selMin').value;

            if(!nome) return alert("Digite o nome!");

            const novaTarefa = {
                name: nome,
                data: data,
                hora: `${h}:${m}`,
                timestamp: data ? new Date(`${data}T${h}:${m}:00`).getTime() : Date.now(),
                concluido: false
            };

            push(agendaRef, novaTarefa);
            document.getElementById('inpNome').value = "";
        };

        window.excluirTarefa = function(id) {
            if(confirm("Apagar tarefa?")) {
                remove(ref(db, `fabiula_agenda/${id}`));
            }
        };

        window.toggleTarefa = function(id, statusAtual) {
            set(ref(db, `fabiula_agenda/${id}/concluido`), !statusAtual);
        };

        function renderizar(lista) {
            const container = document.getElementById('listaPrincipal');
            container.innerHTML = "";

            // Ordenar por data
            lista.sort((a, b) => a[1].timestamp - b[1].timestamp);

            lista.forEach(([id, tarefa]) => {
                const item = document.createElement('div');
                item.className = `item ${tarefa.concluido ? 'done' : ''}`;
                item.innerHTML = `
                    <div class="info">
                        <strong style="${tarefa.concluido ? 'text-decoration: line-through' : ''}">${tarefa.name}</strong><br>
                        <small>${tarefa.data || ''} às ${tarefa.hora}</small>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="excluirTarefa('${id}')" style="border:none; background:none; font-size: 20px;">🗑️</button>
                        <button onclick="toggleTarefa('${id}', ${tarefa.concluido})" style="border:none; background:none; font-size: 20px;">${tarefa.concluido ? '✅' : '⬜'}</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Setup inicial dos campos
        const sh = document.getElementById('selHora');
        const sm = document.getElementById('selMin');
        for(let i=0; i<24; i++) sh.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}h</option>`;
        for(let i=0; i<60; i+=5) sm.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}m</option>`;
        document.getElementById('inpData').value = new Date().toISOString().split('T')[0];

        window.switchTab = function(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('view-agenda').classList.toggle('hidden', tab !== 'agenda');
            document.getElementById('view-projetos').classList.toggle('hidden', tab !== 'projetos');
        }
    </script>
</body>
</html>

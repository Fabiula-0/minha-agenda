<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Fabiula - Inteligente</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 320px; scroll-behavior: smooth; color: #333; }
        
        /* Status temporário que não atrapalha */
        .status-nuvem { position: fixed; top: 10px; right: 10px; font-size: 10px; padding: 5px 12px; border-radius: 15px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 2000; font-weight: bold; transition: opacity 0.5s; opacity: 0; pointer-events: none; }
        .status-nuvem.show { opacity: 1; }
        
        .tabs { display: flex; background: #fff; border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 900; overflow-x: auto; }
        .tab { flex: 1; min-width: 90px; padding: 15px 5px; text-align: center; font-weight: bold; color: #666; cursor: pointer; border: none; background: none; font-size: 0.85rem; }
        .tab.active { color: #2563eb; border-bottom: 3px solid #2563eb; background: #f8fafc; }

        .dia-divisor { background: #e2e8f0; padding: 10px 15px; margin: 20px 10px 10px 10px; font-weight: bold; font-size: 0.9rem; color: #475569; text-transform: capitalize; border-radius: 6px; }
        .dia-divisor.hoje { background: #2563eb; color: white; }
        
        .list { display: flex; flex-direction: column; gap: 12px; padding: 10px; }
        .item { background: white; padding: 16px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.08); border-left: 6px solid #2563eb; }
        .item.done { border-left-color: #94a3b8; opacity: 0.5; }

        .info { flex: 1; }
        .name { font-size: 1.05rem; display: block; margin-bottom: 4px; }
        .name.riscado { text-decoration: line-through; color: #888; }
        .time-label { font-size: 0.85rem; color: #666; font-weight: 500; }

        .actions { display: flex; gap: 15px; align-items: center; }
        .btn-action { font-size: 1.2rem; cursor: pointer; padding: 5px; border: none; background: none; }
        .check-btn { width: 38px; height: 38px; border: 2px solid #cbd5e1; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #fff; font-weight: bold; cursor: pointer; }
        .check-btn.active { background: #059669; color: white; border-color: #059669; }

        .semana-ctrl { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; margin: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px; border-top: 1px solid #ddd; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; outline: none; margin-bottom: 8px; }
        .btn-main { background: #2563eb; color: white; border: none; padding: 16px; border-radius: 10px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="status" class="status-nuvem">Sincronizado ✅</div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('agenda', this)">📅 Agenda</button>
        <button class="tab" onclick="switchTab('semanal', this)">🗓️ Semanal</button>
        <button class="tab" onclick="switchTab('projetos', this)">🏗️ Projetos</button>
        <button class="tab" onclick="switchTab('banco', this)">💡 Ideias</button>
    </div>

    <div id="view-agenda"><div id="minhaLista"></div></div>

    <div id="view-semanal" class="hidden">
        <div class="semana-ctrl">
            <button onclick="mudarSemana(-1)">◀ Ant</button>
            <span id="labelSemana" style="font-weight:bold;"></span>
            <button onclick="mudarSemana(1)">Próx ▶</button>
        </div>
        <div id="listaSemanal"></div>
    </div>

    <div id="view-projetos" class="hidden"><div style="padding:20px; color:#666; text-align:center;">Módulo de Projetos</div></div>
    <div id="view-banco" class="hidden"><div class="list" id="listaBanco"></div></div>

    <div class="footer">
        <input type="text" id="inpNome" placeholder="O que vai fazer?">
        <div style="display:flex; gap:8px;">
            <input type="date" id="inpData" style="flex:2">
            <select id="selHora" style="flex:1"></select>
            <select id="selMin" style="flex:1"></select>
        </div>
        <button class="btn-main" onclick="adicionar()">AGENDAR NA NUVEM</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXrakHMCcdXzxSjzMbNB2LIy8i3R3rMLg",
            authDomain: "agendafabiula.firebaseapp.com",
            databaseURL: "https://agendafabiula-default-rtdb.firebaseio.com",
            projectId: "agendafabiula",
            storageBucket: "agendafabiula.firebasestorage.app",
            messagingSenderId: "234579715371",
            appId: "1:234579715371:web:5ec7ede77e169cd02f116e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const agendaRef = ref(db, 'agenda');

        window.agenda = [];
        let currentTab = 'agenda';
        let dataRefSemana = new Date();

        function showStatus() {
            const s = document.getElementById('status');
            s.classList.add('show');
            setTimeout(() => s.classList.remove('show'), 3000);
        }

        signInAnonymously(auth).catch(console.error);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(agendaRef, (snapshot) => {
                    const data = snapshot.val();
                    window.agenda = data ? Object.entries(data).map(([id, val]) => ({...val, firebaseId: id})) : [];
                    showStatus();
                    renderizar(); // Força a atualização de todas as abas
                });
            }
        });

        window.renderizar = function() {
            renderAgenda();
            renderSemanal();
        };

        function renderAgenda() {
            const lista = document.getElementById('minhaLista');
            const agora = new Date();
            window.agenda.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            lista.innerHTML = '';
            let ultimoDia = "";
            let container = null;

            window.agenda.forEach((item) => {
                if(!item.timestamp) return;
                const dt = new Date(item.timestamp);
                const diaLabel = dt.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'short'});
                
                if(diaLabel !== ultimoDia) {
                    const div = document.createElement('div');
                    div.className = `dia-divisor ${dt.toLocaleDateString() === agora.toLocaleDateString() ? 'hoje' : ''}`;
                    div.innerText = diaLabel;
                    lista.appendChild(div);
                    container = document.createElement('div');
                    container.className = 'list';
                    lista.appendChild(container);
                    ultimoDia = diaLabel;
                }

                container.innerHTML += `
                    <div class="item ${item.concluido ? 'done' : ''}">
                        <div class="info">
                            <span class="name ${item.concluido ? 'riscado' : ''}">${item.name}</span>
                            <span class="time-label">${dt.getHours().toString().padStart(2, '0')}:${dt.getMinutes().toString().padStart(2, '0')}</span>
                        </div>
                        <div class="actions">
                            <span class="btn-action" onclick="excluir('${item.firebaseId}')">🗑️</span>
                            <div class="check-btn ${item.concluido ? 'active' : ''}" onclick="toggle('${item.firebaseId}', ${item.concluido})">✓</div>
                        </div>
                    </div>`;
            });
        }

        function renderSemanal() {
            const lista = document.getElementById('listaSemanal');
            if(!lista) return;

            const start = new Date(dataRefSemana);
            start.setDate(start.getDate() - start.getDay());
            const end = new Date(start);
            end.setDate(end.getDate() + 6);

            document.getElementById('labelSemana').innerText = `${start.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'})} a ${end.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'})}`;
            lista.innerHTML = '';

            for (let i=0; i<7; i++) {
                let dia = new Date(start);
                dia.setDate(dia.getDate() + i);
                let diaStr = dia.toLocaleDateString('pt-BR');
                
                const divDia = document.createElement('div');
                divDia.className = 'dia-divisor';
                divDia.innerText = dia.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric'});
                lista.appendChild(divDia);
                
                const container = document.createElement('div');
                container.className = 'list';
                
                const diaTasks = window.agenda.filter(it => it.timestamp && new Date(it.timestamp).toLocaleDateString('pt-BR') === diaStr);
                
                if(diaTasks.length === 0) {
                    container.innerHTML = '<div style="padding:10px; color:#999; font-size:0.8rem;">Nada agendado</div>';
                } else {
                    diaTasks.forEach(it => {
                        const h = new Date(it.timestamp).getHours().toString().padStart(2, '0');
                        const m = new Date(it.timestamp).getMinutes().toString().padStart(2, '0');
                        container.innerHTML += `<div class="item ${it.concluido?'done':''}" style="padding:10px; font-size:0.9rem;">${h}:${m} - ${it.name}</div>`;
                    });
                }
                lista.appendChild(container);
            }
        }

        window.mudarSemana = function(dir) {
            dataRefSemana.setDate(dataRefSemana.getDate() + (dir * 7));
            renderSemanal();
        };

        window.adicionar = function() {
            const nome = document.getElementById('inpNome').value;
            const data = document.getElementById('inpData').value;
            const h = document.getElementById('selHora').value;
            const m = document.getElementById('selMin').value;
            if(!nome) return;
            let ts = data ? new Date(data + "T" + h + ":" + m + ":00").getTime() : Date.now();
            push(agendaRef, { name: nome, timestamp: ts, concluido: false, id: Date.now() });
            document.getElementById('inpNome').value = '';
        };

        window.toggle = function(fId, status) { set(ref(db, 'agenda/' + fId + '/concluido'), !status); };
        window.excluir = function(fId) { if(confirm("Apagar?")) remove(ref(db, 'agenda/' + fId)); };

        const sh = document.getElementById('selHora');
        const sm = document.getElementById('selMin');
        for(let i=0; i<24; i++) sh.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}h</option>`;
        for(let i=0; i<60; i+=5) sm.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}m</option>`;
        document.getElementById('inpData').value = new Date().toISOString().split('T')[0];

        window.switchTab = function(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            ['view-agenda', 'view-semanal', 'view-projetos', 'view-banco'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            renderizar();
        }
    </script>
</body>
</html>

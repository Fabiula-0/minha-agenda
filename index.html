<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Fabiula - v24</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #121212; margin: 0; padding-bottom: 380px; color: #e0e0e0; scroll-behavior: smooth; }
        
        .tabs { display: flex; background: #1f1f1f; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 900; overflow-x: auto; }
        .tab { flex: 1; min-width: 90px; padding: 15px 5px; text-align: center; font-weight: bold; color: #888; cursor: pointer; border: none; background: none; font-size: 0.85rem; }
        .tab.active { color: #8ab4f8; border-bottom: 3px solid #8ab4f8; background: #252525; }

        .hidden { display: none !important; }
        .riscado { text-decoration: line-through !important; color: #555 !important; }
        .done-global { opacity: 0.25 !important; background: #1a1a1a !important; border-left-color: #333 !important; }
        
        .atrasado { background: #2d1d1d !important; border-left-color: #f87171 !important; }
        .atrasado .name { color: #fca5a5 !important; }

        .dia-divisor { background: #222; padding: 10px 15px; margin: 20px 10px 5px 10px; font-weight: bold; font-size: 0.85rem; border-radius: 6px; color: #8ab4f8; border: 1px solid #333; }
        .item { background: #1f1f1f; padding: 15px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; margin: 0 10px 8px 10px; border-left: 4px solid #8ab4f8; }

        .semana-container { display: flex; width: 100%; padding: 5px; background: #121212; justify-content: space-between; }
        .coluna-dia { width: 14.2%; background: #181818; border: 1px solid #252525; display: flex; flex-direction: column; min-height: 450px; }
        .col-header { padding: 8px; text-align: center; border-bottom: 1px solid #333; background: #222; font-size: 0.8rem; }
        .col-header.hoje { background: #2563eb; color: #fff; }
        .task-card { font-size: 0.7rem; padding: 6px; margin: 2px; border-radius: 3px; background: #3b78db; color: #fff; border-left: 2px solid rgba(0,0,0,0.3); }

        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; padding: 15px; border-top: 1px solid #333; z-index: 1000; }
        input, select { background: #2d2d2d; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
        .btn-main { background: #8ab4f8; color: #000; border: none; padding: 16px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        
        @media (max-width: 900px) { .semana-container { flex-direction: column; } .coluna-dia { width: 100%; min-height: auto; margin-bottom: 5px; } }
    </style>
</head>
<body>

    <div class="tabs">
        <button id="btn-agenda" class="tab active" onclick="switchTab('agenda')">📅 LISTA</button>
        <button id="btn-semanal" class="tab" onclick="switchTab('semanal')">🗓️ SEMANA</button>
        <button id="btn-projetos" class="tab" onclick="switchTab('projetos')">🏗️ PROJETOS</button>
        <button id="btn-notas" class="tab" onclick="switchTab('notas')">💡 NOTAS</button>
    </div>

    <div id="view-agenda"><div id="minhaLista"></div></div>
    <div id="view-semanal" class="hidden"><div id="corpoSemana" class="semana-container"></div></div>
    <div id="view-projetos" class="hidden"><div id="listaProjetos"></div></div>
    <div id="view-notas" class="hidden"><div id="listaNotas" style="padding:15px; display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap:15px;"></div></div>

    <div class="footer">
        <div id="editAviso" style="color: #fbbc04; font-size: 0.8rem; margin-bottom: 5px;" class="hidden">✍️ Editando tarefa...</div>
        <input type="text" id="inpNome" style="width:100%; margin-bottom:8px;" placeholder="O que vamos fazer?">
        <div id="controlesData" style="display:flex; gap:5px; margin-bottom: 8px;">
            <input type="date" id="inpData" style="flex:2">
            <select id="selHora" style="flex:1"></select>
            <select id="selMin" style="flex:1"></select>
        </div>
        <div id="controlesRepetir" style="display:flex; gap:5px; align-items: center; margin-bottom: 5px;">
            <span style="font-size: 0.8rem; color: #aaa;">Repetir:</span>
            <select id="selRepetir" style="flex:1; padding: 5px; font-size: 0.8rem;">
                <option value="nao">Não Repetir</option>
                <option value="diario">Todo dia</option>
                <option value="semanal">Toda semana</option>
                <option value="mensal">Todo mês</option>
            </select>
        </div>
        <button id="btnSalvar" class="btn-main" onclick="adicionarOuSalvar()">SALVAR AGORA</button>
        <button id="btnCancelarEdit" style="background:#444; color:white; border:none; padding:8px; width:100%; border-radius:8px; margin-top:5px;" class="hidden" onclick="cancelarEdicao()">Cancelar Edição</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXrakHMCcdXzxSjzMbNB2LIy8i3R3rMLg",
            authDomain: "agendafabiula.firebaseapp.com",
            databaseURL: "https://agendafabiula-default-rtdb.firebaseio.com",
            projectId: "agendafabiula",
            appId: "1:234579715371:web:5ec7ede77e169cd02f116e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        
        window.agenda = [];
        let currentTab = 'agenda';
        let primeiraCarga = true;

        signInAnonymously(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, 'agenda'), snap => {
                    const val = snap.val();
                    window.agenda = val ? Object.entries(val).map(([id, v]) => ({...v, firebaseId: id})) : [];
                    renderizarTudo();
                    
                    // Se for a primeira vez que a página abre, espera renderizar e pula pro próximo
                    if(primeiraCarga && currentTab === 'agenda') {
                        setTimeout(() => { focarProxima(); primeiraCarga = false; }, 1200);
                    }
                });
                onValue(ref(db, 'projetos'), snap => {
                    window.projetos = snap.val() ? Object.entries(snap.val()).map(([id, v]) => ({...v, firebaseId: id})) : [];
                    renderProjetos();
                });
            }
        });

        window.focarProxima = function() {
            const agora = Date.now();
            const proxima = window.agenda
                .filter(it => it.timestamp && !it.concluido)
                .sort((a,b) => a.timestamp - b.timestamp)[0];

            if(proxima) {
                const el = document.getElementById("task-" + proxima.firebaseId);
                if(el) {
                    const offset = el.offsetTop - 150;
                    window.scrollTo({ top: offset, behavior: 'smooth' });
                }
            }
        };

        window.renderLista = function() {
            const lista = document.getElementById('minhaLista');
            const agora = Date.now();
            window.agenda.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            lista.innerHTML = ''; let ultimoDia = "";
            
            window.agenda.filter(it => it.timestamp).forEach(item => {
                const dt = new Date(item.timestamp);
                const diaLabel = dt.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'short'});
                const estaAtrasado = !item.concluido && dt.getTime() < agora;

                if(diaLabel !== ultimoDia) { lista.innerHTML += `<div class="dia-divisor">${diaLabel}</div>`; ultimoDia = diaLabel; }
                
                lista.innerHTML += `<div id="task-${item.firebaseId}" class="item ${item.concluido ? 'done-global' : ''} ${estaAtrasado ? 'atrasado' : ''}">
                    <div style="flex:1">
                        <span class="name ${item.concluido ? 'riscado' : ''}">${item.name}</span>
                        ${estaAtrasado ? '<br><small style="color:#f87171; font-weight:bold;">⚠️ Pendente</small>' : ''}
                        <br><small style="color:#aaa">${dt.getHours()}h${dt.getMinutes().toString().padStart(2,'0')}</small>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <span onclick="carregarParaEdicao('${item.firebaseId}')" style="cursor:pointer; margin-right:15px; font-size:1.1rem;">✏️</span>
                        <span onclick="excluirTarefa('${item.firebaseId}')" style="cursor:pointer; margin-right:15px;">🗑️</span>
                        <span style="font-size:1.5rem; cursor:pointer" onclick="toggleTarefa('${item.firebaseId}', ${item.concluido})">${item.concluido ? '✅' : '⬜'}</span>
                    </div>
                </div>`;
            });
        };

        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
            ['view-agenda', 'view-semanal', 'view-projetos', 'view-notas'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            
            if(tab === 'agenda') {
                renderLista();
                setTimeout(focarProxima, 300);
            } else {
                renderizarTudo();
            }
        };

        // --- FUNÇÕES MANTIDAS ---
        window.renderizarTudo = function() { renderLista(); renderSemana(); renderProjetos(); renderNotas(); };
        window.toggleTarefa = function(fId, s) { update(ref(db, `agenda/${fId}`), { concluido: !s }); };
        window.excluirTarefa = function(fId) { if(confirm("Excluir?")) remove(ref(db, `agenda/${fId}`)); };
        window.renderSemana = function() {
            const corpo = document.getElementById('corpoSemana'); const hj = new Date();
            const start = new Date(hj); start.setDate(hj.getDate() - hj.getDay());
            corpo.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                let dia = new Date(start); dia.setDate(dia.getDate() + i);
                const col = document.createElement('div'); col.className = 'coluna-dia';
                col.innerHTML = `<div class="col-header ${dia.toLocaleDateString() === hj.toLocaleDateString() ? 'hoje' : ''}">${dia.getDate()}</div>`;
                window.agenda.filter(it => it.timestamp && new Date(it.timestamp).toLocaleDateString() === dia.toLocaleDateString()).forEach(it => {
                    col.innerHTML += `<div class="task-card ${it.concluido ? 'done-global' : ''}">${it.name}</div>`;
                });
                corpo.appendChild(col);
            }
        };
        window.renderProjetos = function() {
            const container = document.getElementById('listaProjetos');
            container.innerHTML = '<div style="padding: 15px;"><button class="btn-main" style="background:#8b5cf6; color:white;" onclick="novoProjeto()">+ Novo Projeto</button></div>';
            window.projetos.forEach(proj => {
                let hist = (proj.historico || []).map(h => `<div style="font-size:0.7rem; border-bottom:1px solid #333; padding:5px;"><b>${h.q}</b>: ${h.a}</div>`).join('');
                container.innerHTML += `<div class="projeto-card">
                    <div style="display:flex; justify-content:space-between;"><strong>${proj.nome}</strong><span onclick="excluirProjeto('${proj.firebaseId}')" style="color:#f44; cursor:pointer;">Excluir</span></div>
                    <div class="pergunta-box"><input type="text" id="inpQ-${proj.firebaseId}" class="inp-pergunta" placeholder="Próxima pergunta...">
                    <button style="background:#059669; color:white; padding:8px; border:none; border-radius:5px;" onclick="processarFluxo('${proj.firebaseId}', 'SIM')">SIM</button>
                    <button style="background:#dc2626; color:white; padding:8px; border:none; border-radius:5px; margin-left:5px;" onclick="processarFluxo('${proj.firebaseId}', 'NÃO')">NÃO</button></div>
                    <details style="margin-top:10px; font-size:0.8rem;"><summary style="cursor:pointer; color:#8ab4f8;">Histórico</summary>${hist}</details>
                </div>`;
            });
        };
        window.renderNotas = function() {
            const c = document.getElementById('listaNotas'); c.innerHTML = '';
            window.agenda.filter(it => !it.timestamp).forEach(nota => {
                c.innerHTML += `<div style="background:#2d2d2d; padding:15px; border-radius:10px; border-top:4px solid #fbbc04;"><span>${nota.name}</span><br><br><button onclick="carregarParaEdicao('${nota.firebaseId}')" style="background:none; border:none; color:#8ab4f8; cursor:pointer;">✏️</button><span onclick="excluirTarefa('${nota.firebaseId}')" style="color:#f44; cursor:pointer; margin-left:15px;">🗑️</span></div>`;
            });
        };
        window.adicionarOuSalvar = function() {
            const nome = document.getElementById('inpNome').value; if(!nome) return;
            let obj = { name: nome, concluido: false, repetir: document.getElementById('selRepetir').value };
            if(currentTab !== 'notas' && document.getElementById('inpData').value) { obj.timestamp = new Date(document.getElementById('inpData').value + "T" + document.getElementById('selHora').value + ":" + document.getElementById('selMin').value + ":00").getTime(); }
            push(ref(db, 'agenda'), obj); document.getElementById('inpNome').value = '';
        };
        window.novoProjeto = function() { const n = prompt("Nome:"); if(n) push(ref(db, 'projetos'), { nome: n, historico: [], checkpoint: 'inicio' }); };
        const sh = document.getElementById('selHora'); const sm = document.getElementById('selMin');
        for(let i=0; i<24; i++) sh.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}h</option>`;
        for(let i=0; i<60; i+=5) sm.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}m</option>`;
        document.getElementById('inpData').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>

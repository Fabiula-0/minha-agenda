<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Fabiula - v20</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #121212; margin: 0; padding-bottom: 380px; color: #e0e0e0; scroll-behavior: smooth; }
        
        .tabs { display: flex; background: #1f1f1f; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 900; }
        .tab { flex: 1; padding: 15px 5px; text-align: center; font-weight: bold; color: #888; cursor: pointer; border: none; background: none; font-size: 0.85rem; }
        .tab.active { color: #8ab4f8; border-bottom: 3px solid #8ab4f8; background: #252525; }

        .hidden { display: none !important; }
        .riscado { text-decoration: line-through !important; color: #555 !important; }
        .done-global { opacity: 0.25 !important; background: #1a1a1a !important; border-left-color: #333 !important; }

        .dia-divisor { background: #222; padding: 10px 15px; margin: 20px 10px 5px 10px; font-weight: bold; font-size: 0.85rem; border-radius: 6px; color: #8ab4f8; border: 1px solid #333; }
        .item { background: #1f1f1f; padding: 15px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; margin: 0 10px 8px 10px; border-left: 4px solid #8ab4f8; }

        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; padding: 15px; border-top: 1px solid #333; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        input, select { background: #2d2d2d; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
        .btn-main { background: #8ab4f8; color: #000; border: none; padding: 16px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-cancel { background: #444; color: #fff; border: none; padding: 8px; border-radius: 8px; width: 100%; margin-top: 5px; font-size: 0.8rem; }
        
        .repeat-tag { font-size: 0.6rem; background: #333; color: #8ab4f8; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
    </style>
</head>
<body>

    <div class="tabs">
        <button id="btn-agenda" class="tab active" onclick="switchTab('agenda')">📅 LISTA</button>
        <button id="btn-notas" class="tab" onclick="switchTab('notas')">💡 NOTAS</button>
    </div>

    <div id="view-agenda"><div id="minhaLista"></div></div>
    <div id="view-notas" class="hidden"><div id="listaNotas" style="padding:15px;"></div></div>

    <div class="footer">
        <div id="editAviso" style="color: #fbbc04; font-size: 0.8rem; margin-bottom: 5px;" class="hidden">✍️ Editando tarefa existente...</div>
        <input type="text" id="inpNome" style="width:100%; margin-bottom:8px;" placeholder="O que vamos agendar?">
        
        <div style="display:flex; gap:5px; margin-bottom: 8px;">
            <input type="date" id="inpData" style="flex:2">
            <select id="selHora" style="flex:1"></select>
            <select id="selMin" style="flex:1"></select>
        </div>

        <div style="display:flex; gap:5px; align-items: center; margin-bottom: 5px;">
            <span style="font-size: 0.8rem; color: #aaa;">Repetir:</span>
            <select id="selRepetir" style="flex:1; padding: 5px; font-size: 0.8rem;">
                <option value="nao">Não Repetir</option>
                <option value="diario">Todo dia</option>
                <option value="semanal">Toda semana</option>
                <option value="mensal">Todo mês</option>
            </select>
        </div>

        <button id="btnSalvar" class="btn-main" onclick="adicionarOuSalvar()">SALVAR AGORA</button>
        <button id="btnCancelarEdit" class="btn-cancel hidden" onclick="cancelarEdicao()">Cancelar Edição</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXrakHMCcdXzxSjzMbNB2LIy8i3R3rMLg",
            authDomain: "agendafabiula.firebaseapp.com",
            databaseURL: "https://agendafabiula-default-rtdb.firebaseio.com",
            projectId: "agendafabiula",
            storageBucket: "agendafabiula.firebasestorage.app",
            messagingSenderId: "234579715371",
            appId: "1:234579715371:web:5ec7ede77e169cd02f116e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        
        window.agenda = [];
        let idEditando = null;
        let currentTab = 'agenda';

        signInAnonymously(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, 'agenda'), (snap) => {
                    const val = snap.val();
                    window.agenda = val ? Object.entries(val).map(([id, v]) => ({...v, firebaseId: id})) : [];
                    renderizarTudo();
                });
            }
        });

        // FUNÇÃO PARA SUBIR DADOS PARA OS BOTÕES
        window.carregarParaEdicao = function(id) {
            idEditando = id;
            const item = window.agenda.find(it => it.firebaseId === id);
            document.getElementById('inpNome').value = item.name;
            document.getElementById('selRepetir').value = item.repetir || 'nao';
            
            if(item.timestamp) {
                const d = new Date(item.timestamp);
                document.getElementById('inpData').value = d.toISOString().split('T')[0];
                document.getElementById('selHora').value = d.getHours().toString().padStart(2,'0');
                document.getElementById('selMin').value = d.getMinutes().toString().padStart(2,'0');
            }

            document.getElementById('editAviso').classList.remove('hidden');
            document.getElementById('btnCancelarEdit').classList.remove('hidden');
            document.getElementById('btnSalvar').innerText = "ATUALIZAR ITEM";
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        };

        window.cancelarEdicao = function() {
            idEditando = null;
            document.getElementById('inpNome').value = '';
            document.getElementById('editAviso').classList.add('hidden');
            document.getElementById('btnCancelarEdit').classList.add('hidden');
            document.getElementById('btnSalvar').innerText = "SALVAR AGORA";
        };

        window.adicionarOuSalvar = function() {
            const nome = document.getElementById('inpNome').value; if(!nome) return;
            const data = document.getElementById('inpData').value;
            const hora = document.getElementById('selHora').value;
            const min = document.getElementById('selMin').value;
            const rep = document.getElementById('selRepetir').value;

            let obj = { 
                name: nome, 
                concluido: false, 
                repetir: rep 
            };

            if(currentTab !== 'notas' && data) {
                obj.timestamp = new Date(data + "T" + hora + ":" + min + ":00").getTime();
            }

            if(idEditando) {
                update(ref(db, `agenda/${idEditando}`), obj);
                cancelarEdicao();
            } else {
                push(ref(db, 'agenda'), obj);
                document.getElementById('inpNome').value = '';
            }
        };

        window.toggleTarefa = function(fId, s) {
            const item = window.agenda.find(it => it.firebaseId === fId);
            const novoStatus = !s;
            
            update(ref(db, `agenda/${fId}`), { concluido: novoStatus });

            // Lógica de Repetição: Se concluiu e tem repetição, cria a próxima
            if(novoStatus && item.repetir && item.repetir !== 'nao' && item.timestamp) {
                let novaData = new Date(item.timestamp);
                if(item.repetir === 'diario') novaData.setDate(novaData.getDate() + 1);
                if(item.repetir === 'semanal') novaData.setDate(novaData.getDate() + 7);
                if(item.repetir === 'mensal') novaData.setMonth(novaData.getMonth() + 1);

                push(ref(db, 'agenda'), {
                    name: item.name,
                    concluido: false,
                    repetir: item.repetir,
                    timestamp: novaData.getTime()
                });
            }
        };

        window.renderLista = function() {
            const lista = document.getElementById('minhaLista');
            window.agenda.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            lista.innerHTML = '';
            let ultimoDia = "";
            window.agenda.filter(it => it.timestamp).forEach((item) => {
                const dt = new Date(item.timestamp);
                const diaLabel = dt.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'short'});
                if(diaLabel !== ultimoDia) { lista.innerHTML += `<div class="dia-divisor">${diaLabel}</div>`; ultimoDia = diaLabel; }
                
                lista.innerHTML += `<div id="task-${item.firebaseId}" class="item ${item.concluido ? 'done-global' : ''}">
                    <div style="flex:1">
                        <span class="${item.concluido ? 'riscado' : ''}">${item.name}</span>
                        ${item.repetir !== 'nao' && item.repetir ? `<span class="repeat-tag">🔁 ${item.repetir}</span>` : ''}
                        <br><small style="color:#aaa">${dt.getHours()}h${dt.getMinutes().toString().padStart(2,'0')}</small>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <span onclick="carregarParaEdicao('${item.firebaseId}')" style="cursor:pointer; margin-right:15px; font-size:1.2rem;">✏️</span>
                        <span onclick="excluirTarefa('${item.firebaseId}')" style="cursor:pointer; margin-right:15px;">🗑️</span>
                        <span style="font-size:1.5rem; cursor:pointer" onclick="toggleTarefa('${item.firebaseId}', ${item.concluido})">${item.concluido ? '✅' : '⬜'}</span>
                    </div>
                </div>`;
            });
        };

        window.renderNotas = function() {
            const container = document.getElementById('listaNotas'); container.innerHTML = '';
            window.agenda.filter(it => !it.timestamp).forEach(nota => {
                container.innerHTML += `<div style="background:#2d2d2d; padding:15px; border-radius:10px; margin-bottom:10px; border-top:4px solid #fbbc04;">
                    <span>${nota.name}</span><br><br>
                    <button onclick="carregarParaEdicao('${nota.firebaseId}')" style="background:none; border:none; color:#8ab4f8; cursor:pointer;">✏️ Editar</button>
                    <span onclick="excluirTarefa('${nota.firebaseId}')" style="color:#f44; font-size:0.7rem; cursor:pointer; margin-left:15px;">[ EXCLUIR ]</span>
                </div>`;
            });
        };

        window.renderizarTudo = function() { renderLista(); renderNotas(); };
        window.excluirTarefa = function(fId) { if(confirm("Excluir?")) remove(ref(db, `agenda/${fId}`)); };
        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
            ['view-agenda', 'view-notas'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            renderizarTudo();
        };

        const sh = document.getElementById('selHora'); const sm = document.getElementById('selMin');
        for(let i=0; i<24; i++) sh.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}h</option>`;
        for(let i=0; i<60; i+=5) sm.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}m</option>`;
        document.getElementById('inpData').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>

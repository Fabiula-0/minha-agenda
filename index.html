<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Fabiula - Calendar Style</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; margin: 0; padding-bottom: 320px; color: #e0e0e0; }
        
        .status-nuvem { position: fixed; top: 10px; right: 10px; font-size: 10px; padding: 5px 12px; border-radius: 15px; background: #333; color: #fff; z-index: 2000; transition: opacity 0.5s; opacity: 0; }
        .status-nuvem.show { opacity: 1; }
        
        .tabs { display: flex; background: #1f1f1f; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 900; }
        .tab { flex: 1; padding: 15px 5px; text-align: center; font-weight: bold; color: #888; cursor: pointer; border: none; background: none; font-size: 0.85rem; }
        .tab.active { color: #8ab4f8; border-bottom: 3px solid #8ab4f8; }

        /* HEADER DA SEMANA (Igual à imagem) */
        .semana-header-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            background: #121212; 
            text-align: center; 
            padding: 10px 5px;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 50px;
            z-index: 800;
        }
        .dia-nome { font-size: 0.65rem; color: #aaa; text-transform: uppercase; margin-bottom: 5px; }
        .dia-numero { font-size: 1.4rem; width: 40px; height: 40px; line-height: 40px; margin: 0 auto; border-radius: 50%; transition: 0.3s; }
        .dia-numero.hoje { background: #8ab4f8; color: #000; font-weight: bold; }

        /* GRID DE TAREFAS */
        .semana-corpo-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 4px; 
            padding: 5px;
            min-height: 400px;
            background: #121212;
        }
        .coluna-dia { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            border-right: 1px solid #222;
            min-height: 100%;
        }

        /* CARD ESTILO GOOGLE CALENDAR */
        .task-card { 
            font-size: 0.75rem; 
            padding: 6px 8px; 
            border-radius: 4px; 
            background: #4285f4; /* Azul padrão */
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 3px solid rgba(0,0,0,0.2);
            margin: 1px 2px;
        }
        .task-card.meta { background: #e67c73; } /* Estilo para tarefas de meta/aniversário */
        .task-card.concluida { opacity: 0.4; background: #555 !important; text-decoration: line-through; }

        /* AGENDA DIÁRIA (Lista) */
        .dia-divisor { background: #333; padding: 10px 15px; margin: 15px 10px 5px 10px; font-weight: bold; font-size: 0.85rem; border-radius: 6px; color: #8ab4f8; }
        .item { background: #1f1f1f; padding: 15px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; margin: 0 10px 8px 10px; border-left: 4px solid #8ab4f8; }
        .item.done { opacity: 0.4; border-left-color: #555; }

        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; padding: 15px; border-top: 1px solid #333; z-index: 1000; }
        input, select { background: #2d2d2d; border: 1px solid #444; color: white; width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 8px; font-size: 16px; }
        .btn-main { background: #8ab4f8; color: #000; border: none; padding: 16px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
        
        .hidden { display: none !important; }
        .semana-nav { display: flex; justify-content: space-between; padding: 10px; background: #121212; }
        .semana-nav button { background: none; border: 1px solid #444; color: #8ab4f8; padding: 5px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="status" class="status-nuvem">Sincronizado ✅</div>

    <div class="tabs">
        <button id="btn-agenda" class="tab active" onclick="switchTab('agenda')">📅 LISTA</button>
        <button id="btn-semanal" class="tab" onclick="switchTab('semanal')">🗓️ SEMANA</button>
        <button id="btn-projetos" class="tab" onclick="switchTab('projetos')">🏗️ PROJETOS</button>
    </div>

    <div id="view-agenda">
        <div id="minhaLista"></div>
    </div>

    <div id="view-semanal" class="hidden">
        <div class="semana-nav">
            <button onclick="mudarSemana(-1)">◀ ANTERIOR</button>
            <span id="labelMes" style="font-weight:bold; color:#8ab4f8"></span>
            <button onclick="mudarSemana(1)">PRÓXIMA ▶</button>
        </div>
        
        <div id="headerDias" class="semana-header-grid"></div>
        <div id="corpoSemana" class="semana-corpo-grid"></div>
    </div>

    <div id="view-projetos" class="hidden"><div style="padding:40px; text-align:center; color:#666;">Painel de Projetos</div></div>

    <div class="footer">
        <input type="text" id="inpNome" placeholder="O que vai fazer?">
        <div style="display:flex; gap:8px;">
            <input type="date" id="inpData" style="flex:2">
            <select id="selHora" style="flex:1"></select>
            <select id="selMin" style="flex:1"></select>
        </div>
        <button class="btn-main" onclick="adicionar()">AGENDAR TAREFA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXrakHMCcdXzxSjzMbNB2LIy8i3R3rMLg",
            authDomain: "agendafabiula.firebaseapp.com",
            databaseURL: "https://agendafabiula-default-rtdb.firebaseio.com",
            projectId: "agendafabiula",
            storageBucket: "agendafabiula.firebasestorage.app",
            messagingSenderId: "234579715371",
            appId: "1:234579715371:web:5ec7ede77e169cd02f116e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const agendaRef = ref(db, 'agenda');

        window.agenda = [];
        let currentTab = 'agenda';
        let dataRefSemana = new Date();

        signInAnonymously(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(agendaRef, (snapshot) => {
                    const data = snapshot.val();
                    window.agenda = data ? Object.entries(data).map(([id, val]) => ({...val, firebaseId: id})) : [];
                    renderizar();
                });
            }
        });

        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
            ['view-agenda', 'view-semanal', 'view-projetos'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            renderizar();
        };

        function renderizar() {
            if (currentTab === 'agenda') renderLista();
            if (currentTab === 'semanal') renderSemanaEstiloGoogle();
        }

        function renderLista() {
            const lista = document.getElementById('minhaLista');
            const hoje = new Date().toLocaleDateString('pt-BR');
            window.agenda.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            lista.innerHTML = '';
            let ultimoDia = "";

            window.agenda.forEach((item) => {
                const dt = new Date(item.timestamp);
                const diaLabel = dt.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'short'});
                if(diaLabel !== ultimoDia) {
                    const div = document.createElement('div');
                    div.className = 'dia-divisor';
                    div.innerText = diaLabel;
                    lista.appendChild(div);
                    ultimoDia = diaLabel;
                }
                const itemDiv = document.createElement('div');
                itemDiv.className = `item ${item.concluido ? 'done' : ''}`;
                itemDiv.innerHTML = `
                    <div class="info">
                        <span class="name ${item.concluido ? 'riscado' : ''}">${item.name}</span>
                        <span class="time-label" style="color:#aaa">${dt.getHours().toString().padStart(2, '0')}:${dt.getMinutes().toString().padStart(2, '0')}</span>
                    </div>
                    <div style="display:flex; gap:15px;">
                        <span onclick="excluir('${item.firebaseId}')">🗑️</span>
                        <span onclick="toggle('${item.firebaseId}', ${item.concluido})">${item.concluido ? '✅' : '⬜'}</span>
                    </div>`;
                lista.appendChild(itemDiv);
            });
        }

        function renderSemanaEstiloGoogle() {
            const header = document.getElementById('headerDias');
            const corpo = document.getElementById('corpoSemana');
            const hojeData = new Date();
            const hojeStr = hojeData.toLocaleDateString('pt-BR');

            const start = new Date(dataRefSemana);
            start.setDate(start.getDate() - start.getDay()); // Começa no Domingo

            document.getElementById('labelMes').innerText = start.toLocaleDateString('pt-BR', {month:'long', year:'numeric'}).toUpperCase();
            
            header.innerHTML = '';
            corpo.innerHTML = '';

            const nomesDias = ['DOM.', 'SEG.', 'TER.', 'QUA.', 'QUI.', 'SEX.', 'SÁB.'];

            for (let i = 0; i < 7; i++) {
                let dia = new Date(start);
                dia.setDate(dia.getDate() + i);
                let diaStr = dia.toLocaleDateString('pt-BR');

                // Cabeçalho
                const isHoje = diaStr === hojeStr;
                header.innerHTML += `
                    <div>
                        <div class="dia-nome">${nomesDias[i]}</div>
                        <div class="dia-numero ${isHoje ? 'hoje' : ''}">${dia.getDate()}</div>
                    </div>`;

                // Coluna de tarefas
                const col = document.createElement('div');
                col.className = 'coluna-dia';
                
                const tasks = window.agenda.filter(it => new Date(it.timestamp).toLocaleDateString('pt-BR') === diaStr);
                
                tasks.forEach(it => {
                    const h = new Date(it.timestamp).getHours().toString().padStart(2, '0');
                    const tipoClasse = it.name.toLowerCase().includes('meta') ? 'meta' : '';
                    const concluidaClasse = it.concluido ? 'concluida' : '';
                    
                    col.innerHTML += `
                        <div class="task-card ${tipoClasse} ${concluidaClasse}">
                            ${h}h - ${it.name}
                        </div>`;
                });
                corpo.appendChild(col);
            }
        }

        window.mudarSemana = function(dir) {
            dataRefSemana.setDate(dataRefSemana.getDate() + (dir * 7));
            renderSemanaEstiloGoogle();
        };

        window.adicionar = function() {
            const nome = document.getElementById('inpNome').value;
            const data = document.getElementById('inpData').value;
            const h = document.getElementById('selHora').value;
            const m = document.getElementById('selMin').value;
            if(!nome) return;
            let ts = data ? new Date(data + "T" + h + ":" + m + ":00").getTime() : Date.now();
            push(agendaRef, { name: nome, timestamp: ts, concluido: false });
            document.getElementById('inpNome').value = '';
            renderizar();
        };

        window.toggle = function(fId, status) { set(ref(db, 'agenda/' + fId + '/concluido'), !status); };
        window.excluir = function(fId) { if(confirm("Apagar?")) remove(ref(db, 'agenda/' + fId)); };

        const sh = document.getElementById('selHora');
        const sm = document.getElementById('selMin');
        for(let i=0; i<24; i++) sh.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}h</option>`;
        for(let i=0; i<60; i+=5) sm.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}m</option>`;
        document.getElementById('inpData').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>

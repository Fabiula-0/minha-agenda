<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Fabiula - Nuvem</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 350px; scroll-behavior: smooth; color: #333; }
        
        .tabs { display: flex; background: #fff; border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 900; overflow-x: auto; }
        .tab { flex: 1; min-width: 90px; padding: 15px 5px; text-align: center; font-weight: bold; color: #666; cursor: pointer; font-size: 0.85rem; border: none; background: none; }
        .tab.active { color: #2563eb; border-bottom: 3px solid #2563eb; background: #f8fafc; }

        .dia-divisor { background: #e2e8f0; padding: 10px 15px; margin: 20px 10px 10px 10px; font-weight: bold; font-size: 0.9rem; color: #475569; text-transform: capitalize; border-radius: 6px; }
        .dia-divisor.hoje { background: #2563eb; color: white; }
        .list { display: flex; flex-direction: column; gap: 12px; padding: 10px; }
        
        .item { background: white; padding: 16px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.08); border-left: 6px solid #2563eb; transition: 0.3s; }
        .item.now { border-left-color: #059669; background: #f0fdf4; font-weight: bold; border-left-width: 10px; }
        .item.past { border-left-color: #94a3b8; opacity: 0.7; background: #f9f9f9; }
        .item.done { border-left-color: #94a3b8; opacity: 0.5; }

        .info { flex: 1; }
        .name { font-size: 1.05rem; display: block; margin-bottom: 4px; }
        .name.riscado { text-decoration: line-through; color: #888; }
        .time-label { font-size: 0.85rem; color: #666; font-weight: 500; }

        .actions { display: flex; gap: 15px; align-items: center; }
        .btn-action { font-size: 1.2rem; cursor: pointer; padding: 5px; border: none; background: none; }
        .check-btn { width: 38px; height: 38px; border: 2px solid #cbd5e1; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #fff; font-weight: bold; cursor: pointer; }
        .check-btn.active { background: #059669; color: white; border-color: #059669; }

        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; border-top: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); z-index: 1000; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; outline: none; background: #fff; }
        .row { display: flex; gap: 8px; width: 100%; }
        .btn-main { background: #2563eb; color: white; border: none; padding: 16px; border-radius: 10px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; }
        
        .status-nuvem { position: fixed; top: 60px; right: 10px; font-size: 10px; padding: 3px 8px; border-radius: 10px; background: #eee; z-index: 1001; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="status" class="status-nuvem">Conectando...</div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('agenda', this)">📅 Agenda</button>
        <button class="tab" onclick="switchTab('semanal', this)">🗓️ Semanal</button>
        <button class="tab" onclick="switchTab('projetos', this)">🏗️ Projetos</button>
        <button class="tab" onclick="switchTab('banco', this)">💡 Ideias</button>
    </div>

    <div id="view-agenda"><div id="minhaLista"></div></div>
    <div id="view-semanal" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; background:#fff; margin:10px; border-radius:8px;">
            <button onclick="mudarSemana(-1)">◀ Ant</button>
            <span id="labelSemana" style="font-weight:bold;"></span>
            <button onclick="mudarSemana(1)">Próx ▶</button>
        </div>
        <div id="listaSemanal"></div>
    </div>
    <div id="view-projetos" class="hidden"><div id="listaProjetos"></div></div>
    <div id="view-banco" class="hidden"><div class="list" id="listaBanco"></div></div>

    <div class="footer">
        <input type="text" id="inpNome" placeholder="O que vai fazer?">
        <div class="row">
            <input type="date" id="inpData" style="flex:2">
            <select id="selHora" style="flex:1"></select>
            <select id="selMin" style="flex:1"></select>
        </div>
        <select id="inpRepetir">
            <option value="none">Não repetir</option>
            <option value="diario">Repetir Todo Dia</option>
            <option value="semanal">Toda Semana</option>
            <option value="mensal">Todo Mês</option>
        </select>
        <button class="btn-main" onclick="adicionar()">AGENDAR NA NUVEM</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXrakHMCcdXzxSjzMbNB2LIy8i3R3rMLg",
            authDomain: "agendafabiula.firebaseapp.com",
            databaseURL: "https://agendafabiula-default-rtdb.firebaseio.com",
            projectId: "agendafabiula",
            storageBucket: "agendafabiula.firebasestorage.app",
            messagingSenderId: "234579715371",
            appId: "1:234579715371:web:5ec7ede77e169cd02f116e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const agendaRef = ref(db, 'agenda');
        const projetosRef = ref(db, 'projetos');

        window.agenda = [];
        window.projetos = [];
        let currentTab = 'agenda';
        let dataRefSemana = new Date();

        // Sincronização em Tempo Real
        onValue(agendaRef, (snapshot) => {
            const data = snapshot.val();
            window.agenda = data ? Object.values(data) : [];
            document.getElementById('status').innerText = "Sincronizado ✅";
            renderizar();
        });

        // Funções Globais
        window.adicionar = function() {
            const nome = document.getElementById('inpNome').value;
            const data = document.getElementById('inpData').value;
            const h = document.getElementById('selHora').value;
            const m = document.getElementById('selMin').value;
            const repetir = document.getElementById('inpRepetir').value;

            if(!nome) return;

            let ts = data ? new Date(data + "T" + h + ":" + m + ":00").getTime() : null;
            const novoItem = { name: nome, timestamp: ts, concluido: false, repetir: repetir, id: Date.now() };
            
            // Salva direto no Firebase (Nuvem)
            const novoRef = push(agendaRef);
            set(novoRef, novoItem);
            
            document.getElementById('inpNome').value = '';
        };

        window.toggle = function(id) {
            // Localiza o item no Firebase pelo ID e inverte o status
            onValue(agendaRef, (snapshot) => {
                const data = snapshot.val();
                for (let key in data) {
                    if (data[key].id == id) {
                        const itemRef = ref(db, 'agenda/' + key);
                        set(itemRef, { ...data[key], concluido: !data[key].concluido });
                        break;
                    }
                }
            }, { onlyOnce: true });
        };

        window.excluir = function(id) {
            if(!confirm("Apagar da nuvem?")) return;
            onValue(agendaRef, (snapshot) => {
                const data = snapshot.val();
                for (let key in data) {
                    if (data[key].id == id) {
                        set(ref(db, 'agenda/' + key), null);
                        break;
                    }
                }
            }, { onlyOnce: true });
        };

        window.renderizar = function() {
            if(currentTab === 'agenda') renderAgenda();
            if(currentTab === 'semanal') renderSemanal();
        }

        function renderAgenda() {
            const lista = document.getElementById('minhaLista');
            const agora = new Date();
            const hojeStr = agora.toLocaleDateString('pt-BR');
            
            window.agenda.sort((a, b) => (a.timestamp || 9999999999999) - (b.timestamp || 9999999999999));
            lista.innerHTML = '';
            let ultimoDia = "";
            let container = null;

            window.agenda.forEach((item) => {
                if(!item.timestamp) return;
                const dt = new Date(item.timestamp);
                const diaLabel = dt.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'short'});
                
                if(diaLabel !== ultimoDia) {
                    const isHoje = dt.toLocaleDateString('pt-BR') === hojeStr;
                    const div = document.createElement('div');
                    div.className = `dia-divisor ${isHoje?'hoje':''}`;
                    div.innerText = `${isHoje?'Hoje - ':''}${diaLabel}`;
                    lista.appendChild(div);
                    container = document.createElement('div');
                    container.className = 'list';
                    lista.appendChild(container);
                    ultimoDia = diaLabel;
                }

                let cl = 'item ' + (item.concluido ? 'done' : (dt < agora ? 'past' : ''));
                container.innerHTML += `
                    <div class="${cl}">
                        <div class="info">
                            <span class="name ${item.concluido ? 'riscado' : ''}">${item.name}</span>
                            <span class="time-label">${dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                        <div class="actions">
                            <span class="btn-action" onclick="excluir(${item.id})">🗑️</span>
                            <div class="check-btn ${item.concluido ? 'active' : ''}" onclick="toggle(${item.id})">✓</div>
                        </div>
                    </div>`;
            });
        }

        // Setup inicial de horas
        const sh = document.getElementById('selHora');
        const sm = document.getElementById('selMin');
        for(let i=0; i<24; i++) sh.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}h</option>`;
        for(let i=0; i<60; i+=5) sm.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}m</option>`;
        document.getElementById('inpData').value = new Date().toISOString().split('T')[0];

        window.switchTab = function(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            ['view-agenda', 'view-semanal', 'view-projetos', 'view-banco'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            renderizar();
        }
    </script>
</body>
</html>

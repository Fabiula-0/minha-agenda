<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minha Agenda & Projetos</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 350px; scroll-behavior: smooth; color: #333; }
        
        /* Menu Superior - Scannable */
        .tabs { display: flex; background: #fff; border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 900; overflow-x: auto; }
        .tab { flex: 1; min-width: 90px; padding: 15px 5px; text-align: center; font-weight: bold; color: #666; cursor: pointer; font-size: 0.85rem; border: none; background: none; transition: 0.3s; }
        .tab.active { color: #2563eb; border-bottom: 3px solid #2563eb; background: #f8fafc; }

        /* Divisores e Listas */
        .dia-divisor { background: #e2e8f0; padding: 10px 15px; margin: 20px 10px 10px 10px; font-weight: bold; font-size: 0.9rem; color: #475569; text-transform: capitalize; border-radius: 6px; }
        .dia-divisor.hoje { background: #2563eb; color: white; }
        .list { display: flex; flex-direction: column; gap: 12px; padding: 10px; }
        
        .item { background: white; padding: 16px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.08); border-left: 6px solid #2563eb; }
        .item.now { border-left-color: #059669; background: #f0fdf4; font-weight: bold; border-left-width: 10px; }
        .item.past { border-left-color: #94a3b8; opacity: 0.7; background: #f9f9f9; }
        .item.done { border-left-color: #94a3b8; opacity: 0.5; }

        .info { flex: 1; }
        .name { font-size: 1.05rem; display: block; margin-bottom: 4px; }
        .name.riscado { text-decoration: line-through; color: #888; }
        .time-label { font-size: 0.85rem; color: #666; font-weight: 500; }

        .actions { display: flex; gap: 15px; align-items: center; }
        .btn-action { font-size: 1.2rem; cursor: pointer; padding: 5px; border: none; background: none; }
        .check-btn { width: 38px; height: 38px; border: 2px solid #cbd5e1; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #fff; font-weight: bold; cursor: pointer; }
        .check-btn.active { background: #059669; color: white; border-color: #059669; }

        /* Projetos Card */
        .projeto-card { background: white; margin: 10px; padding: 15px; border-radius: 10px; border-top: 5px solid #8b5cf6; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .projeto-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; display: block; }
        .etapa-box { background: #f8fafc; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px solid #e2e8f0; }

        /* Rodapé Fixo - Ajustado para Clique no PC */
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; border-top: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); z-index: 1000; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; outline: none; background: #fff; color: #000; }
        .row { display: flex; gap: 8px; width: 100%; }
        .btn-main { background: #2563eb; color: white; border: none; padding: 16px; border-radius: 10px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('agenda', this)">📅 Agenda</button>
        <button class="tab" onclick="switchTab('semanal', this)">🗓️ Semanal</button>
        <button class="tab" onclick="switchTab('projetos', this)">🏗️ Projetos</button>
        <button class="tab" onclick="switchTab('banco', this)">💡 Ideias</button>
    </div>

    <div id="view-agenda">
        <div id="minhaLista"></div>
    </div>

    <div id="view-semanal" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; background:#fff; margin:10px; border-radius:8px;">
            <button onclick="mudarSemana(-1)">◀ Ant</button>
            <span id="labelSemana" style="font-weight:bold;"></span>
            <button onclick="mudarSemana(1)">Próx ▶</button>
        </div>
        <div id="listaSemanal"></div>
    </div>

    <div id="view-projetos" class="hidden">
        <div style="padding:10px;"><button class="btn-main" style="background:#8b5cf6;" onclick="abrirModalProjeto()">+ Novo Projeto Regularização</button></div>
        <div id="listaProjetos"></div>
    </div>

    <div id="view-banco" class="hidden">
        <div class="list" id="listaBanco"></div>
    </div>

    <div class="footer">
        <input type="text" id="inpNome" placeholder="O que vai fazer?">
        <div class="row">
            <input type="date" id="inpData" style="flex:2">
            <select id="selHora" style="flex:1"></select>
            <select id="selMin" style="flex:1"></select>
        </div>
        <select id="inpRepetir">
            <option value="none">Não repetir</option>
            <option value="diario">Repetir Todo Dia</option>
            <option value="semanal">Repetir Toda Semana</option>
            <option value="mensal">Repetir Todo Mês</option>
        </select>
        <button class="btn-main" onclick="adicionar()">AGENDAR</button>
        <div style="display:flex; gap:10px;">
            <button onclick="exportarDados()" style="flex:1; padding:8px; border-radius:8px; border:1px solid #ddd; background:#f8fafc; cursor:pointer; font-size:12px;">💾 Exportar Backup</button>
            <button onclick="importarDados()" style="flex:1; padding:8px; border-radius:8px; border:1px solid #ddd; background:#f8fafc; cursor:pointer; font-size:12px;">📂 Importar Backup</button>
        </div>
    </div>

<script>
    let agenda = JSON.parse(localStorage.getItem('agenda_vFinal')) || [];
    let projetos = JSON.parse(localStorage.getItem('projetos_v1')) || [];
    let dataReferenciaSemana = new Date();
    let currentTab = 'agenda';

    // Popular horas/minutos
    const sh = document.getElementById('selHora');
    const sm = document.getElementById('selMin');
    for(let i=0; i<24; i++) sh.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}h</option>`;
    for(let i=0; i<60; i+=5) sm.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}m</option>`;

    function switchTab(tab, el) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        ['view-agenda', 'view-semanal', 'view-projetos', 'view-banco'].forEach(v => document.getElementById(v).classList.add('hidden'));
        document.getElementById('view-' + tab).classList.remove('hidden');
        renderizar();
    }

    function renderizar() {
        if (currentTab === 'agenda') renderAgenda();
        if (currentTab === 'semanal') renderSemanal();
        if (currentTab === 'projetos') renderProjetos();
        if (currentTab === 'banco') renderBanco();
        
        localStorage.setItem('agenda_vFinal', JSON.stringify(agenda));
        localStorage.setItem('projetos_v1', JSON.stringify(projetos));
    }

    function renderAgenda() {
        const lista = document.getElementById('minhaLista');
        const agora = new Date();
        const hojeStr = agora.toLocaleDateString('pt-BR');
        
        // Regra da Qualidade: mantém atrasados hoje
        agenda.forEach(item => {
            if (item.timestamp && !item.concluido) {
                let d = new Date(item.timestamp);
                let meiaHoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate()).getTime();
                if (d.getTime() < meiaHoje) {
                    d.setFullYear(agora.getFullYear(), agora.getMonth(), agora.getDate());
                    item.timestamp = d.getTime();
                }
            }
        });

        agenda.sort((a, b) => (a.timestamp || 9999999999999) - (b.timestamp || 9999999999999));
        lista.innerHTML = '';
        let ultimoDia = "";
        let container = null;

        agenda.forEach((item, index) => {
            if (!item.timestamp) return;
            const dt = new Date(item.timestamp);
            const diaLabel = dt.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'short'});
            
            if (diaLabel !== ultimoDia) {
                const isHoje = dt.toLocaleDateString('pt-BR') === hojeStr;
                const divisor = document.createElement('div');
                divisor.className = `dia-divisor ${isHoje?'hoje':''}`;
                divisor.innerText = `${isHoje?'Hoje - ':''}${diaLabel}`;
                lista.appendChild(divisor);
                container = document.createElement('div');
                container.className = 'list';
                lista.appendChild(container);
                ultimoDia = diaLabel;
            }

            let cl = 'item ' + (item.concluido ? 'done' : (dt < agora ? 'past' : ''));
            container.innerHTML += `
                <div class="${cl}">
                    <div class="info">
                        <span class="name ${item.concluido ? 'riscado' : ''}">${item.name}</span>
                        <span class="time-label">${dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="actions">
                        <span class="btn-action" onclick="excluir(${index})">🗑️</span>
                        <div class="check-btn ${item.concluido ? 'active' : ''}" onclick="toggle(${index})">${item.concluido ? '✓' : ''}</div>
                    </div>
                </div>`;
        });
    }

    function renderSemanal() {
        const lista = document.getElementById('listaSemanal');
        const start = new Date(dataReferenciaSemana);
        start.setDate(start.getDate() - start.getDay());
        const end = new Date(start);
        end.setDate(end.getDate() + 6);

        document.getElementById('labelSemana').innerText = `${start.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'})} a ${end.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'})}`;
        lista.innerHTML = '';

        for (let i=0; i<7; i++) {
            let dia = new Date(start);
            dia.setDate(dia.getDate() + i);
            let diaStr = dia.toLocaleDateString('pt-BR');
            lista.innerHTML += `<div class="dia-divisor">${dia.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric'})}</div>`;
            
            const diaTasks = agenda.filter(it => it.timestamp && new Date(it.timestamp).toLocaleDateString('pt-BR') === diaStr);
            let sublist = '<div class="list">';
            diaTasks.forEach(it => {
                sublist += `<div class="item ${it.concluido?'done':''}" style="padding:10px;">${new Date(it.timestamp).getHours()}h: ${it.name}</div>`;
            });
            lista.innerHTML += sublist + '</div>';
        }
    }

    function renderProjetos() {
        const container = document.getElementById('listaProjetos');
        container.innerHTML = '';
        projetos.forEach((proj, pIdx) => {
            container.innerHTML += `
                <div class="projeto-card">
                    <span class="projeto-title">${proj.nome}</span>
                    <div class="etapa-box">
                        <strong>Fase: ${proj.etapa}</strong>
                    </div>
                    <button onclick="excluirProjeto(${pIdx})" style="margin-top:10px; background:none; border:none; color:red; cursor:pointer;">Apagar Projeto</button>
                </div>`;
        });
    }

    function renderBanco() {
        const lista = document.getElementById('listaBanco');
        lista.innerHTML = '<div class="dia-divisor">Ideias sem data</div>';
        agenda.filter(it => !it.timestamp).forEach((it, idx) => {
            lista.innerHTML += `<div class="item"><span>${it.name}</span><button onclick="excluir(${idx})">🗑️</button></div>`;
        });
    }

    function mudarSemana(dir) {
        dataReferenciaSemana.setDate(dataReferenciaSemana.getDate() + (dir * 7));
        renderSemanal();
    }

    function adicionar() {
        const nome = document.getElementById('inpNome').value;
        const data = document.getElementById('inpData').value;
        const h = document.getElementById('selHora').value;
        const m = document.getElementById('selMin').value;
        if (!nome) return;
        let ts = data ? new Date(data + "T" + h + ":" + m + ":00").getTime() : null;
        agenda.push({ name: nome, timestamp: ts, concluido: false });
        document.getElementById('inpNome').value = '';
        renderizar();
    }

    function toggle(i) { agenda[i].concluido = !agenda[i].concluido; renderizar(); }
    function excluir(i) { if(confirm("Apagar?")) { agenda.splice(i, 1); renderizar(); } }

    function abrirModalProjeto() {
        const n = prompt("Nome do Projeto:");
        if(n) { projetos.push({nome: n, etapa: "Análise Documental"}); renderizar(); }
    }
    
    function excluirProjeto(i) { if(confirm("Apagar projeto?")) { projetos.splice(i, 1); renderizar(); } }

    function exportarDados() {
        const dados = JSON.stringify({agenda, projetos});
        navigator.clipboard.writeText(dados).then(() => alert("Backup copiado! Cole no outro dispositivo."));
    }

    function importarDados() {
        const cod = prompt("Cole o código de backup:");
        if (cod) {
            try {
                const p = JSON.parse(cod);
                agenda = p.agenda || [];
                projetos = p.projetos || [];
                renderizar();
            } catch(e) { alert("Erro!"); }
        }
    }

    const d = new Date();
    document.getElementById('inpData').value = d.toISOString().split('T')[0];
    renderizar();
</script>
</body>
</html>

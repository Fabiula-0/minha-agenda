<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Fabiula - Fluxo Inteligente</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #121212; margin: 0; padding-bottom: 350px; color: #e0e0e0; scroll-behavior: smooth; }
        
        .status-nuvem { position: fixed; top: 10px; right: 10px; font-size: 10px; padding: 5px 12px; border-radius: 15px; background: #333; color: #8ab4f8; z-index: 2000; opacity: 0; transition: opacity 0.5s; pointer-events: none; }
        .status-nuvem.show { opacity: 1; }
        
        .tabs { display: flex; background: #1f1f1f; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 900; }
        .tab { flex: 1; padding: 15px 5px; text-align: center; font-weight: bold; color: #888; cursor: pointer; border: none; background: none; font-size: 0.85rem; }
        .tab.active { color: #8ab4f8; border-bottom: 3px solid #8ab4f8; background: #252525; }

        .hidden { display: none !important; }
        .riscado { text-decoration: line-through !important; color: #666 !important; }
        .done-global { opacity: 0.4 !important; background: #333 !important; }

        /* LISTA DIÁRIA */
        .dia-divisor { background: #222; padding: 10px 15px; margin: 20px 10px 5px 10px; font-weight: bold; font-size: 0.85rem; border-radius: 6px; color: #8ab4f8; border: 1px solid #333; }
        .item { background: #1f1f1f; padding: 15px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; margin: 0 10px 8px 10px; border-left: 4px solid #8ab4f8; }

        /* SEMANA - 7 COLUNAS PC */
        .semana-container { display: flex; width: 100%; padding: 5px; background: #121212; justify-content: space-between; }
        .coluna-dia { width: 14.2%; background: #181818; border: 1px solid #252525; display: flex; flex-direction: column; min-height: 450px; overflow: hidden; }
        .col-header { padding: 8px; text-align: center; border-bottom: 1px solid #333; background: #222; }
        .col-header.hoje { background: #2563eb; color: #fff; }
        .task-card { font-size: 0.7rem; padding: 6px; margin: 2px; border-radius: 3px; background: #3b78db; color: #fff; display: flex; align-items: center; justify-content: space-between; border-left: 3px solid rgba(0,0,0,0.3); }

        /* PROJETOS - FLUXO DE DECISÃO */
        .projeto-card { background: #1f1f1f; margin: 15px; padding: 20px; border-radius: 12px; border-top: 6px solid #8b5cf6; }
        .fluxo-pergunta { background: #252525; padding: 20px; border-radius: 10px; margin-top: 15px; border: 1px solid #333; text-align: center; }
        .btn-fluxo { padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin: 10px 5px; min-width: 100px; }
        .btn-sim { background: #059669; color: white; }
        .btn-nao { background: #dc2626; color: white; }
        .historico-passos { font-size: 0.75rem; color: #777; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px; }

        /* NOTAS */
        #listaNotas { padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .nota-card { background: #2d2d2d; padding: 15px; border-radius: 10px; border-top: 4px solid #fbbc04; }

        /* FOOTER */
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; padding: 15px; border-top: 1px solid #333; z-index: 1000; }
        input, select { background: #2d2d2d; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
        .btn-main { background: #8ab4f8; color: #000; border: none; padding: 16px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }

        @media (max-width: 900px) {
            .semana-container { flex-direction: column; }
            .coluna-dia { width: 100%; min-height: auto; margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <div id="status" class="status-nuvem">Sincronizado ✅</div>

    <div class="tabs">
        <button id="btn-agenda" class="tab active" onclick="switchTab('agenda')">📅 LISTA</button>
        <button id="btn-semanal" class="tab" onclick="switchTab('semanal')">🗓️ SEMANA</button>
        <button id="btn-projetos" class="tab" onclick="switchTab('projetos')">🏗️ PROJETOS</button>
        <button id="btn-notas" class="tab" onclick="switchTab('notas')">💡 NOTAS</button>
    </div>

    <div id="view-agenda"><div id="minhaLista"></div></div>
    <div id="view-semanal" class="hidden">
        <div style="display:flex; justify-content: space-between; padding:10px; align-items:center;">
            <button onclick="mudarSemana(-1)" style="background:none; border:1px solid #444; color:#8ab4f8; padding:5px 15px; border-radius:8px;">◀</button>
            <span id="labelMes" style="font-weight:bold; color:#8ab4f8; text-transform:uppercase; font-size:0.8rem;"></span>
            <button onclick="mudarSemana(1)" style="background:none; border:1px solid #444; color:#8ab4f8; padding:5px 15px; border-radius:8px;">▶</button>
        </div>
        <div id="corpoSemana" class="semana-container"></div>
    </div>

    <div id="view-projetos" class="hidden">
        <div style="padding: 15px;"><button class="btn-main" style="background:#8b5cf6; color:white;" onclick="novoProjetoFluxo()">+ Iniciar Novo Fluxo de Regularização</button></div>
        <div id="listaProjetos"></div>
    </div>

    <div id="view-notas" class="hidden"><div id="listaNotas"></div></div>

    <div class="footer">
        <input type="text" id="inpNome" style="width:100%; margin-bottom:8px;" placeholder="Título...">
        <div id="controlesData" style="display:flex; gap:8px;">
            <input type="date" id="inpData" style="flex:2">
            <select id="selHora" style="flex:1"></select>
            <select id="selMin" style="flex:1"></select>
        </div>
        <button class="btn-main" onclick="adicionar()">SALVAR AGORA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXrakHMCcdXzxSjzMbNB2LIy8i3R3rMLg",
            authDomain: "agendafabiula.firebaseapp.com",
            databaseURL: "https://agendafabiula-default-rtdb.firebaseio.com",
            projectId: "agendafabiula",
            storageBucket: "agendafabiula.firebasestorage.app",
            messagingSenderId: "234579715371",
            appId: "1:234579715371:web:5ec7ede77e169cd02f116e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        
        window.agenda = [];
        window.projetos = [];
        let currentTab = 'agenda';
        let dataRefSemana = new Date();

        // DEFINIÇÃO DO FLUXO (O motor do sistema)
        const fluxoDecisao = {
            "inicio": {
                pergunta: "O cliente possui a Matrícula atualizada (30 dias)?",
                sim: "tem_escritura",
                nao: "acao_pedir_matricula"
            },
            "acao_pedir_matricula": {
                pergunta: "A Matrícula foi solicitada ao Cartório?",
                sim: "tem_escritura",
                nao: "AGENDAR: Solicitar Matrícula no Cartório",
                retroceder: "inicio"
            },
            "tem_escritura": {
                pergunta: "O imóvel possui Escritura ou Contrato de Compra e Venda?",
                sim: "conferir_iptu",
                nao: "acao_analise_posse"
            },
            "conferir_iptu": {
                pergunta: "O IPTU está em dia e no nome do cliente?",
                sim: "medicao_campo",
                nao: "AGENDAR: Regularizar débitos de IPTU"
            },
            "medicao_campo": {
                pergunta: "A medição de campo já foi realizada?",
                sim: "finalizado",
                nao: "AGENDAR: Realizar medição técnica no local"
            },
            "finalizado": {
                pergunta: "Fluxo Concluído! Deseja arquivar o projeto?",
                sim: "arquivado",
                nao: "inicio"
            }
        };

        signInAnonymously(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, 'agenda'), (snap) => {
                    const val = snap.val();
                    window.agenda = val ? Object.entries(val).map(([id, v]) => ({...v, firebaseId: id})) : [];
                    renderizarTudo();
                });
                onValue(ref(db, 'projetos'), (snap) => {
                    const val = snap.val();
                    window.projetos = val ? Object.entries(val).map(([id, v]) => ({...v, firebaseId: id})) : [];
                    document.getElementById('status').classList.add('show');
                    setTimeout(() => document.getElementById('status').classList.remove('show'), 2000);
                    renderizarTudo();
                });
            }
        });

        window.renderProjetos = function() {
            const container = document.getElementById('listaProjetos');
            container.innerHTML = '';
            
            window.projetos.forEach(proj => {
                const etapaAtual = fluxoDecisao[proj.checkpoint] || fluxoDecisao["inicio"];
                const eAgendamento = etapaAtual.pergunta.includes("AGENDAR:");

                container.innerHTML += `
                    <div class="projeto-card">
                        <div style="display:flex; justify-content:space-between;">
                            <strong style="font-size:1.2rem; color:#8ab4f8;">${proj.nome}</strong>
                            <span onclick="excluirProjeto('${proj.firebaseId}')" style="color:#f44; cursor:pointer; font-size:0.8rem;">Excluir</span>
                        </div>
                        
                        <div class="fluxo-pergunta">
                            <p style="margin-bottom:15px; font-weight:500;">${etapaAtual.pergunta}</p>
                            
                            ${!eAgendamento ? `
                                <button class="btn-fluxo btn-sim" onclick="responderFluxo('${proj.firebaseId}', 'sim')">SIM</button>
                                <button class="btn-fluxo btn-nao" onclick="responderFluxo('${proj.firebaseId}', 'nao')">NÃO</button>
                            ` : `
                                <button class="btn-fluxo btn-sim" style="background:#8ab4f8; color:#000; width:80%;" onclick="gerarTarefaFluxo('${proj.firebaseId}', '${etapaAtual.pergunta}')">AGENDAR NA MINHA LISTA</button>
                                <br><small onclick="responderFluxo('${proj.firebaseId}', 'sim')" style="cursor:pointer; color:#777; text-decoration:underline;">Já fiz, pular para o próximo</small>
                            `}
                        </div>
                        <div class="historico-passos">Status: ${proj.checkpoint === 'finalizado' ? '✅ Concluído' : '🔄 Em andamento'}</div>
                    </div>
                `;
            });
        };

        window.responderFluxo = function(pId, resposta) {
            const proj = window.projetos.find(p => p.firebaseId === pId);
            const proximoPasso = fluxoDecisao[proj.checkpoint][resposta];
            
            if (proximoPasso) {
                proj.checkpoint = proximoPasso;
                set(ref(db, 'projetos/' + pId), proj);
            }
        };

        window.gerarTarefaFluxo = function(pId, texto) {
            const data = prompt("Para qual dia deseja agendar?", new Date().toISOString().split('T')[0]);
            if(data) {
                const tarefaNome = texto.replace("AGENDAR: ", "");
                push(ref(db, 'agenda'), { 
                    name: tarefaNome, 
                    timestamp: new Date(data + "T09:00:00").getTime(), 
                    concluido: false 
                });
                alert("Tarefa enviada para sua LISTA!");
                // Após agendar, avançamos o fluxo como "Sim" (tratado)
                window.responderFluxo(pId, 'sim');
            }
        };

        window.novoProjetoFluxo = function() {
            const nome = prompt("Nome do Cliente/Obra:");
            if(nome) {
                push(ref(db, 'projetos'), {
                    nome: nome,
                    checkpoint: "inicio",
                    dataCriacao: Date.now()
                });
            }
        };

        // Restante das funções de Agenda/Notas (mantidas das versões anteriores)
        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
            ['view-agenda', 'view-semanal', 'view-projetos', 'view-notas'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            document.getElementById('controlesData').style.display = (tab === 'notas' || tab === 'projetos') ? 'none' : 'flex';
            renderizarTudo();
        };

        function renderizarTudo() { renderLista(); renderSemana(); renderProjetos(); renderNotas(); }

        function renderLista() {
            const lista = document.getElementById('minhaLista');
            window.agenda.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            lista.innerHTML = '';
            let ultimoDia = "";
            window.agenda.filter(it => it.timestamp).forEach((item) => {
                const dt = new Date(item.timestamp);
                const diaLabel = dt.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'short'});
                if(diaLabel !== ultimoDia) {
                    lista.innerHTML += `<div class="dia-divisor">${diaLabel}</div>`;
                    ultimoDia = diaLabel;
                }
                lista.innerHTML += `<div class="item ${item.concluido?'done-global':''}">
                    <div><span class="${item.concluido?'riscado':''}">${item.name}</span><br><small style="color:#aaa">${dt.getHours()}h${dt.getMinutes().toString().padStart(2,'0')}</small></div>
                    <div style="display:flex; gap:15px; align-items:center;">
                        <span onclick="excluirTarefa('${item.firebaseId}')" style="cursor:pointer">🗑️</span>
                        <span style="font-size:1.5rem; cursor:pointer" onclick="toggleTarefa('${item.firebaseId}', ${item.concluido})">${item.concluido ? '✅' : '⬜'}</span>
                    </div>
                </div>`;
            });
        }

        function renderSemana() {
            const corpo = document.getElementById('corpoSemana');
            const start = new Date(dataRefSemana);
            start.setDate(start.getDate() - start.getDay());
            document.getElementById('labelMes').innerText = start.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
            corpo.innerHTML = '';
            const nomes = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
            for (let i = 0; i < 7; i++) {
                let dia = new Date(start);
                dia.setDate(dia.getDate() + i);
                let diaStr = dia.toLocaleDateString('pt-BR');
                const col = document.createElement('div');
                col.className = 'coluna-dia';
                col.innerHTML = `<div class="col-header ${diaStr === new Date().toLocaleDateString('pt-BR')?'hoje':''}">
                    <span style="font-size:0.6rem; display:block; opacity:0.6;">${nomes[i]}</span>
                    <span style="font-size:1.2rem; font-weight:bold;">${dia.getDate()}</span>
                </div>`;
                window.agenda.filter(it => it.timestamp && new Date(it.timestamp).toLocaleDateString('pt-BR') === diaStr).forEach(it => {
                    col.innerHTML += `<div class="task-card ${it.concluido?'done-global':''}"><b>${new Date(it.timestamp).getHours()}h</b> <span class="${it.concluido?'riscado':''}">${it.name}</span></div>`;
                });
                corpo.appendChild(col);
            }
        }

        function renderNotas() {
            const container = document.getElementById('listaNotas');
            container.innerHTML = '';
            window.agenda.filter(it => !it.timestamp).forEach(nota => {
                container.innerHTML += `<div class="nota-card"><span>${nota.name}</span><br><span onclick="excluirTarefa('${nota.firebaseId}')" style="color:#f44; font-size:0.7rem; cursor:pointer; margin-top:10px; display:inline-block;">[ REMOVER ]</span></div>`;
            });
        }

        window.toggleTarefa = function(fId, s) { set(ref(db, `agenda/${fId}/concluido`), !s); };
        window.excluirTarefa = function(fId) { if(confirm("Excluir?")) remove(ref(db, `agenda/${fId}`)); };
        window.excluirProjeto = function(fId) { if(confirm("Excluir projeto?")) remove(ref(db, `projetos/${fId}`)); };
        window.mudarSemana = function(dir) { dataRefSemana.setDate(dataRefSemana.getDate() + (dir * 7)); renderSemana(); };
        window.adicionar = function() {
            const nome = document.getElementById('inpNome').value; if(!nome) return;
            let obj = { name: nome, concluido: false };
            if(currentTab !== 'notas' && currentTab !== 'projetos' && document.getElementById('inpData').value) obj.timestamp = new Date(document.getElementById('inpData').value + "T" + document.getElementById('selHora').value + ":" + document.getElementById('selMin').value + ":00").getTime();
            push(ref(db, 'agenda'), obj); document.getElementById('inpNome').value = '';
        };

        const sh = document.getElementById('selHora'); const sm = document.getElementById('selMin');
        for(let i=0; i<24; i++) sh.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}h</option>`;
        for(let i=0; i<60; i+=5) sm.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}m</option>`;
        document.getElementById('inpData').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>

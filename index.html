<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Fabiula - v19</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #121212; margin: 0; padding-bottom: 350px; color: #e0e0e0; scroll-behavior: smooth; }
        
        .tabs { display: flex; background: #1f1f1f; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 900; }
        .tab { flex: 1; padding: 15px 5px; text-align: center; font-weight: bold; color: #888; cursor: pointer; border: none; background: none; font-size: 0.85rem; }
        .tab.active { color: #8ab4f8; border-bottom: 3px solid #8ab4f8; background: #252525; }

        .hidden { display: none !important; }
        .riscado { text-decoration: line-through !important; color: #555 !important; }
        .done-global { opacity: 0.25 !important; background: #1a1a1a !important; border-left-color: #333 !important; }

        .dia-divisor { background: #222; padding: 10px 15px; margin: 20px 10px 5px 10px; font-weight: bold; font-size: 0.85rem; border-radius: 6px; color: #8ab4f8; border: 1px solid #333; }
        .item { background: #1f1f1f; padding: 15px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; margin: 0 10px 8px 10px; border-left: 4px solid #8ab4f8; }

        /* MODAL DE EDIÇÃO */
        #modalEdicao { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #252525; padding: 20px; border-radius: 15px; border: 1px solid #444; z-index: 2000; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1999; }
        .inp-edit { width: 100%; background: #121212; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 1rem; }

        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; padding: 15px; border-top: 1px solid #333; z-index: 1000; }
        input, select { background: #2d2d2d; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
        .btn-main { background: #8ab4f8; color: #000; border: none; padding: 16px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        
        .btn-salvar { background: #34d399; color: #000; border: none; padding: 10px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-cancelar { background: #555; color: #fff; border: none; padding: 10px; border-radius: 5px; width: 100%; cursor: pointer; margin-top: 5px; }

        @media (max-width: 900px) {
            .semana-container { display: flex; flex-direction: column; }
        }
    </style>
</head>
<body>

    <div id="overlay" class="overlay hidden" onclick="fecharModal()"></div>
    <div id="modalEdicao" class="hidden">
        <h3 style="margin-top:0; color:#8ab4f8;">Editar Atividade</h3>
        <input type="text" id="editNome" class="inp-edit" placeholder="Nome...">
        <div id="editCamposData">
            <label style="font-size: 0.7rem; color: #aaa;">Data e Hora:</label>
            <input type="datetime-local" id="editDataHora" class="inp-edit">
        </div>
        <button class="btn-salvar" onclick="salvarEdicao()">ATUALIZAR</button>
        <button class="btn-cancelar" onclick="fecharModal()">CANCELAR</button>
    </div>

    <div class="tabs">
        <button id="btn-agenda" class="tab active" onclick="switchTab('agenda')">📅 LISTA</button>
        <button id="btn-semanal" class="tab" onclick="switchTab('semanal')">🗓️ SEMANA</button>
        <button id="btn-projetos" class="tab" onclick="switchTab('projetos')">🏗️ PROJETOS</button>
        <button id="btn-notas" class="tab" onclick="switchTab('notas')">💡 NOTAS</button>
    </div>

    <div id="view-agenda"><div id="minhaLista"></div></div>
    <div id="view-semanal" class="hidden"><div id="corpoSemana" style="padding:10px;"></div></div>
    <div id="view-projetos" class="hidden"><div id="listaProjetos"></div></div>
    <div id="view-notas" class="hidden"><div id="listaNotas" style="padding:15px;"></div></div>

    <div class="footer">
        <input type="text" id="inpNome" style="width:100%; margin-bottom:8px;" placeholder="Nova tarefa...">
        <div style="display:flex; gap:8px;">
            <input type="date" id="inpData" style="flex:2">
            <select id="selHora" style="flex:1"></select>
            <select id="selMin" style="flex:1"></select>
        </div>
        <button class="btn-main" onclick="adicionar()">SALVAR AGORA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXrakHMCcdXzxSjzMbNB2LIy8i3R3rMLg",
            authDomain: "agendafabiula.firebaseapp.com",
            databaseURL: "https://agendafabiula-default-rtdb.firebaseio.com",
            projectId: "agendafabiula",
            storageBucket: "agendafabiula.firebasestorage.app",
            messagingSenderId: "234579715371",
            appId: "1:234579715371:web:5ec7ede77e169cd02f116e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        
        window.agenda = [];
        let idSendoEditado = null;
        let currentTab = 'agenda';

        signInAnonymously(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, 'agenda'), (snap) => {
                    const val = snap.val();
                    window.agenda = val ? Object.entries(val).map(([id, v]) => ({...v, firebaseId: id})) : [];
                    renderizarTudo();
                    if(currentTab === 'agenda') setTimeout(focarProxima, 800);
                });
                onValue(ref(db, 'projetos'), (snap) => {
                    window.projetos = snap.val() ? Object.entries(snap.val()).map(([id, v]) => ({...v, firebaseId: id})) : [];
                    renderProjetos();
                });
            }
        });

        window.abrirModalEdicao = function(id) {
            idSendoEditado = id;
            const item = window.agenda.find(it => it.firebaseId === id);
            document.getElementById('editNome').value = item.name;
            
            if(item.timestamp) {
                document.getElementById('editCamposData').classList.remove('hidden');
                // Formata timestamp para o input datetime-local (YYYY-MM-DDTHH:MM)
                const d = new Date(item.timestamp);
                const localISO = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().slice(0,16);
                document.getElementById('editDataHora').value = localISO;
            } else {
                document.getElementById('editCamposData').classList.add('hidden');
            }
            
            document.getElementById('modalEdicao').classList.remove('hidden');
            document.getElementById('overlay').classList.remove('hidden');
        };

        window.fecharModal = function() {
            document.getElementById('modalEdicao').classList.add('hidden');
            document.getElementById('overlay').classList.add('hidden');
            idSendoEditado = null;
        };

        window.salvarEdicao = function() {
            if(!idSendoEditado) return;
            const item = window.agenda.find(it => it.firebaseId === idSendoEditado);
            let dados = { name: document.getElementById('editNome').value };
            
            if(item.timestamp) {
                const novaData = document.getElementById('editDataHora').value;
                if(novaData) dados.timestamp = new Date(novaData).getTime();
            }
            
            update(ref(db, `agenda/${idSendoEditado}`), dados);
            fecharModal();
        };

        window.renderLista = function() {
            const lista = document.getElementById('minhaLista');
            window.agenda.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            lista.innerHTML = '';
            let ultimoDia = "";
            window.agenda.filter(it => it.timestamp).forEach((item) => {
                const dt = new Date(item.timestamp);
                const diaLabel = dt.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'short'});
                if(diaLabel !== ultimoDia) { lista.innerHTML += `<div class="dia-divisor">${diaLabel}</div>`; ultimoDia = diaLabel; }
                lista.innerHTML += `<div id="task-${item.firebaseId}" class="item ${item.concluido ? 'done-global' : ''}">
                    <div style="flex:1"><span class="${item.concluido ? 'riscado' : ''}">${item.name}</span><br><small style="color:#aaa">${dt.getHours()}h${dt.getMinutes().toString().padStart(2,'0')}</small></div>
                    <div style="display:flex; align-items:center;">
                        <span onclick="abrirModalEdicao('${item.firebaseId}')" style="cursor:pointer; margin-right:15px; font-size:1.2rem;">✏️</span>
                        <span onclick="excluirTarefa('${item.firebaseId}')" style="cursor:pointer; margin-right:15px;">🗑️</span>
                        <span style="font-size:1.5rem; cursor:pointer" onclick="toggleTarefa('${item.firebaseId}', ${item.concluido})">${item.concluido ? '✅' : '⬜'}</span>
                    </div>
                </div>`;
            });
        };

        function focarProxima() {
            const agora = Date.now();
            const proxima = window.agenda.filter(it => it.timestamp && !it.concluido).sort((a,b) => a.timestamp - b.timestamp).find(it => it.timestamp > (agora - 1800000));
            if(proxima) {
                const el = document.getElementById("task-" + proxima.firebaseId);
                if(el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 150, behavior: 'smooth' });
            }
        }

        window.renderizarTudo = function() { renderLista(); renderNotas(); };
        window.toggleTarefa = function(fId, s) { update(ref(db, `agenda/${fId}`), { concluido: !s }); };
        window.excluirTarefa = function(fId) { if(confirm("Excluir?")) remove(ref(db, `agenda/${fId}`)); };
        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
            ['view-agenda', 'view-semanal', 'view-projetos', 'view-notas'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById('view-' + tab).classList.remove('hidden');
            renderizarTudo();
        };

        window.renderNotas = function() {
            const container = document.getElementById('listaNotas'); container.innerHTML = '';
            window.agenda.filter(it => !it.timestamp).forEach(nota => {
                container.innerHTML += `<div style="background:#2d2d2d; padding:15px; border-radius:10px; margin-bottom:10px; border-top:4px solid #fbbc04;">
                    <span>${nota.name}</span><br><br>
                    <button onclick="abrirModalEdicao('${nota.firebaseId}')" style="background:none; border:none; color:#8ab4f8; cursor:pointer;">✏️ Editar</button>
                    <span onclick="excluirTarefa('${nota.firebaseId}')" style="color:#f44; font-size:0.7rem; cursor:pointer; margin-left:15px;">[ EXCLUIR ]</span>
                </div>`;
            });
        };

        window.adicionar = function() {
            const nome = document.getElementById('inpNome').value; if(!nome) return;
            let obj = { name: nome, concluido: false };
            if(currentTab !== 'notas' && document.getElementById('inpData').value) {
                obj.timestamp = new Date(document.getElementById('inpData').value + "T" + document.getElementById('selHora').value + ":" + document.getElementById('selMin').value + ":00").getTime();
            }
            push(ref(db, 'agenda'), obj); document.getElementById('inpNome').value = '';
        };

        const sh = document.getElementById('selHora'); const sm = document.getElementById('selMin');
        for(let i=0; i<24; i++) sh.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}h</option>`;
        for(let i=0; i<60; i+=5) sm.innerHTML += `<option value="${i<10?'0'+i:i}">${i<10?'0'+i:i}m</option>`;
        document.getElementById('inpData').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
